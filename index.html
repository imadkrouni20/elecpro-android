<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ElecStudio</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- شاشة الترحيب -->
<div class="splash" id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" class="bolt">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d4ff"/>
      </linearGradient></defs>
      <circle cx="50" cy="50" r="42" fill="none" stroke="url(#bg)" stroke-width="2" opacity="0.4"/>
      <path d="M55 20 L35 55 L50 55 L45 80 L65 45 L50 45 Z" fill="url(#bg)"/>
    </svg>
  </div>
  <h1>ElecStudio</h1>
  <p>تصميم كهربائي احترافي</p>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<!-- الرئيسية -->
<div class="screen" id="s-dash">
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div class="hero-row">
        <div>
          <div class="hero-greet">مرحبًا 👋</div>
          <div class="hero-title">استوديو الكهرباء</div>
        </div>
        <button class="icon-btn" data-nav="settings" aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="hero-stats">
        <div class="stat"><b id="statProjects">0</b><span>مشروع</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><b id="statCircuits">0</b><span>دارة</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><b id="statKw">0</b><span>kW</span></div>
      </div>
    </div>
  </header>

  <main class="content">
    <h2 class="section-title">ابدأ سريعًا</h2>
    <div class="quick-grid">
      <button class="quick" data-nav="wizard">
        <div class="quick-icon" style="--c1:#7c5cff;--c2:#5b3ce6">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div class="quick-label">مشروع جديد</div>
      </button>
      <button class="quick" data-nav="cad">
        <div class="quick-icon" style="--c1:#00d4ff;--c2:#0093b8">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M9 3v18"/></svg>
        </div>
        <div class="quick-label">المخطط 2D</div>
      </button>
      <button class="quick" data-nav="view3d">
        <div class="quick-icon" style="--c1:#10d980;--c2:#0a9c5c">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg>
        </div>
        <div class="quick-label">مشهد 3D</div>
      </button>
      <button class="quick" data-nav="electrical">
        <div class="quick-icon" style="--c1:#ffb84d;--c2:#d98a1e">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
        </div>
        <div class="quick-label">حسابات</div>
      </button>
      <button class="quick" data-nav="components">
        <div class="quick-icon" style="--c1:#ff5964;--c2:#c4353f">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <div class="quick-label">المكونات</div>
      </button>
      <button class="quick" data-nav="reports">
        <div class="quick-icon" style="--c1:#a78bfa;--c2:#7c5cff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
        </div>
        <div class="quick-label">التقارير</div>
      </button>
    </div>

    <div class="row-title">
      <h2 class="section-title">المشاريع الأخيرة</h2>
      <button class="text-btn" data-nav="projects">عرض الكل</button>
    </div>
    <div class="project-scroll" id="recentProjects">
      <div class="empty-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <p>لا مشاريع بعد</p>
        <button class="btn-primary" data-nav="wizard">ابدأ الآن</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="nav-btn" data-nav="cad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
      <span>المخطط</span>
    </button>
    <button class="nav-btn fab" data-nav="wizard" aria-label="جديد">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nav-btn" data-nav="view3d">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg>
      <span>3D</span>
    </button>
    <button class="nav-btn" data-nav="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span>تقارير</span>
    </button>
  </nav>
</div>

<!-- شاشة عامة (تُملأ لاحقًا) -->

<!-- شاشة CAD -->
<div class="screen" id="s-cad">
  <header class="cad-header">
    <button class="icon-btn" data-nav="dash">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="cad-title">
      <div class="cad-floor" id="cadFloorLbl">الطابق 1</div>
      <div class="cad-sub" id="cadCount">0 عنصر</div>
    </div>
    <button class="icon-btn" id="cadUndo" title="تراجع">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6M3 13a9 9 0 0 1 15-6.7L21 9"/></svg>
    </button>
    <button class="icon-btn" id="cadRedo" title="إعادة">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6M21 13a9 9 0 0 0-15-6.7L3 9"/></svg>
    </button>
    <button class="icon-btn" id="cadFit" title="ملاءمة">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4"/></svg>
    </button>
  </header>
  <div class="cad-floorbar" id="cadFloors"></div>
  <div class="cad-canvas-wrap">
    <canvas id="cadCanvas"></canvas>
    <div class="cad-hint" id="cadHint">اختر أداة من الشريط السفلي</div>
    <div class="cad-zoom">
      <button id="cadZoomIn">+</button>
      <button id="cadZoomOut">−</button>
    </div>
    <div class="cad-crosshair" id="cadCoord">X: 0.00 | Z: 0.00</div>
  </div>
  <div class="cad-tools" id="cadTools">
    <button data-tool="select" class="active">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-8 8-3z"/></svg>
      <span>تحديد</span>
    </button>
    <button data-tool="wall">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      <span>جدار</span>
    </button>
    <button data-tool="room">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span>غرفة</span>
    </button>
    <button data-tool="door">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18M5 3h10v18H5M15 12h4"/></svg>
      <span>باب</span>
    </button>
    <button data-tool="window">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="8"/><path d="M12 8v8"/></svg>
      <span>نافذة</span>
    </button>
    <button data-tool="dim">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
      <span>قياس</span>
    </button>
    <button data-tool="del">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      <span>حذف</span>
    </button>
  </div>
  <div class="cad-options" id="cadOptions">
    <button data-opt="grid" class="active">شبكة</button>
    <button data-opt="snap" class="active">التقاط</button>
    <button data-opt="ortho">90°</button>
    <button data-opt="dims" class="active">أبعاد</button>
    <button data-opt="labels" class="active">تسميات</button>
  </div>
  <div class="cad-props" id="cadProps"></div>
</div>


<!-- شاشة 3D -->
<div class="screen" id="s-view3d">
  <header class="cad-header">
    <button class="icon-btn" data-nav="cad">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="cad-title">
      <div class="cad-floor">المشهد 3D</div>
      <div class="cad-sub" id="v3dSub">انقر على جدار أو سقف</div>
    </div>
    <button class="icon-btn" id="v3dFit" title="ملاءمة">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4"/></svg>
    </button>
    <button class="icon-btn" id="v3dRebuild" title="إعادة بناء">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.7-2.4 2.5-5.7 2.5-9S13.7 5.4 12 3m0 18c-1.7-2.4-2.5-5.7-2.5-9S10.3 5.4 12 3m-9 9a9 9 0 0 1 9-9"/></svg>
    </button>
  </header>
  <div class="cad-canvas-wrap">
    <canvas id="v3dCanvas"></canvas>
    <div class="cad-hint" id="v3dHint">اسحب للدوران • إصبعان للتقريب • انقر لاختيار</div>
  </div>
  <div class="cad-options" id="v3dOptions">
    <button id="v3dWalls" class="active">جدران</button>
    <button id="v3dCeil" class="active">أسقف</button>
    <button id="v3dGrid" class="active">شبكة</button>
    <button id="v3dWire">أسلاك</button>
  </div>
</div>

<div class="screen" id="s-page">
  <header class="page-header">
    <button class="icon-btn" data-nav="dash" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="pageTitle">عنوان</h1>
    <div style="width:40px"></div>
  </header>
  <main class="content" id="pageBody"></main>
</div>

<div class="toast-host" id="toastHost"></div>
<div class="sheet-host" id="sheetHost"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="js/shell.js"></script>
</body>
</html>
