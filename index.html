<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>كهرباء البنايات</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen active" id="s-setup">
  <header><h1>⚡ كهرباء البنايات</h1></header>
  <div class="body">
    <label>عرض البناية (م)<input type="number" id="iW" value="10" step="0.5"></label>
    <label>طول البناية (م)<input type="number" id="iL" value="12" step="0.5"></label>
    <label>عدد الطوابق<input type="number" id="iF" value="2" min="1" max="5"></label>
    <label>غرف لكل طابق<input type="number" id="iR" value="4" min="1" max="9"></label>
    <label>ارتفاع الطابق (م)<input type="number" id="iH" value="2.8" step="0.1"></label>
    <button class="primary" id="btnConfirm">✅ تأكيد و الانتقال للتصميم</button>
  </div>
</div>

<div class="screen" id="s-plan">
  <header>
    <button class="back" data-back="s-setup">◀</button>
    <h1>مخطط الطابق <span id="planFloor">1</span></h1>
    <button class="back" id="btnPlan3D">3D ▶</button>
  </header>
  <div class="body plan-body">
    <canvas id="planCanvas"></canvas>
    <div class="floor-tabs" id="planFloors"></div>
  </div>
</div>

<div class="screen" id="s-3d">
  <header>
    <button class="back" data-back="s-plan">◀</button>
    <h1>المشهد ثلاثي الأبعاد</h1>
    <button class="back" id="btnReport">📋</button>
  </header>
  <div class="body no-pad">
    <div id="viewer3d">
      <canvas id="c3d"></canvas>
      <div id="info3d">اضغط على حائط أو سقف لتعديله</div>
      <div id="controls3d">
        <button id="btnRunWires" class="go">⚡ تنفيذ الأسلاك</button>
        <button id="btnClearWires">✖ مسح</button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="s-wall">
  <header>
    <button class="back" data-back="s-3d">◀</button>
    <h1 id="wallTitle">الحائط</h1>
  </header>
  <div class="body edit-body">
    <canvas id="wallCanvas"></canvas>
    <aside class="palette" id="wallPalette"></aside>
  </div>
</div>

<div class="screen" id="s-ceil">
  <header>
    <button class="back" data-back="s-3d">◀</button>
    <h1 id="ceilTitle">السقف</h1>
  </header>
  <div class="body edit-body">
    <canvas id="ceilCanvas"></canvas>
    <aside class="palette" id="ceilPalette"></aside>
  </div>
</div>

<div class="screen" id="s-report">
  <header>
    <button class="back" data-back="s-3d">◀</button>
    <h1>📋 تقرير المواد</h1>
  </header>
  <div class="body report-body" id="reportBody"></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
